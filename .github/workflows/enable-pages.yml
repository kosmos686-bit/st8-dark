name: Enable Pages

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kosmos686-bit/st8-dark/pages/builds